name: chain-day

# T2 (docs/PLAN.md §6): freezes one finished UTC day of intents.near swaps into data/chain/<day>.jsonl, read in parallel block ranges,
# and from the same read the day's treasury transfers into data/treasury/<day>.jsonl (PREREG A2 rule 8).
# Keyless public reads only (FastNEAR, NEAR RPC, DefiLlama). cron-job.org starts it through the API every day
# (commit true) to freeze yesterday, with a later second chance; a run that finds yesterday frozen stops in seconds. GitHub's own
# schedule dropped most runs, so it is not used.
# A day is written once and never changed. A day that cannot be read well stays a gap, the run fails and Telegram says so; the next
# run does not go back and fill it in.
# It commits only after `npm run verify` passes. By hand, `commit` decides (default off: the files are uploaded as an artifact).
# DISCOVER on looks for new solvers and hubs today; otherwise that happens once a week.
on:
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day, YYYY-MM-DD (empty: yesterday)'
        type: string
        default: ''
      commit:
        description: 'Commit the frozen day to the branch this run is on'
        type: boolean
        default: false
      discover:
        description: 'Look for new solvers and hubs today'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: chain-day

jobs:
  # Decides the day, stops in seconds if it is frozen, and runs the weekly filler discovery.
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      todo: ${{ steps.start.outputs.todo }}
    steps:
      # The branch as it is now, not as it was when this run was queued: a retry must see the day the first run froze.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: start
        env:
          STAGE: start
          WORK: ${{ runner.temp }}/work
          DISCOVER: ${{ inputs.discover && '1' || '' }}
          DAY: ${{ inputs.day }}
          GAP_MS: '500'
        run: node pipeline/chain_day.mjs $DAY
      - if: steps.start.outputs.todo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: work-start
          path: ${{ runner.temp }}/work/start.json
          retention-days: 1

  # The census by block range, one runner each. The treasury passed 200k transactions a day on 5 Nov, and one runner can read about 325k before
  # GitHub's 6-hour cap. The list here must match PARTS in pipeline/chain_day.mjs.
  read:
    needs: start
    if: needs.start.outputs.todo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: work-start
          path: ${{ runner.temp }}/work
      - name: Read this part
        env:
          STAGE: read
          PART: ${{ matrix.part }}
          WORK: ${{ runner.temp }}/work
          # Two FastNEAR calls a second (default one). A 429 still waits and tries again, and the run counts them.
          GAP_MS: '500'
        run: node pipeline/chain_day.mjs
      # Holds account names from public chain data, so it is kept one day and never committed.
      - uses: actions/upload-artifact@v4
        with:
          name: work-part-${{ matrix.part }}
          path: ${{ runner.temp }}/work/part-${{ matrix.part }}.jsonl
          retention-days: 1

  freeze:
    needs: [start, read]
    if: needs.start.outputs.todo == 'true' && needs.read.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The branch as it is now, not as it was when this run was queued: a retry must see the day the first run froze.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: work-*
          path: ${{ runner.temp }}/work
          merge-multiple: true
      - name: Freeze the day
        env:
          STAGE: finish
          WORK: ${{ runner.temp }}/work
        run: node pipeline/chain_day.mjs
      - name: Recompute the published files and check them
        run: |
          npm run rebuild
          npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: chain
          path: |
            data/chain/
            data/treasury/
            data/published/chain_days.json
      - name: Commit
        if: inputs.commit
        run: |
          git config user.name "tideline-chain"
          git config user.email "tideline-chain@users.noreply.github.com"
          # Keep this run's files. If another run moved the branch (the backfill, refresh), start again from it and add them once more.
          mkdir -p "$RUNNER_TEMP/keep" "$RUNNER_TEMP/keep-treasury" && cp data/chain/*.jsonl data/chain/fillers.json "$RUNNER_TEMP/keep/"
          cp data/treasury/*.jsonl "$RUNNER_TEMP/keep-treasury/" 2>/dev/null || true
          for i in 1 2 3; do
            git add data THESIS.md
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "data: freeze chain day"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
            cp -n "$RUNNER_TEMP/keep"/*.jsonl data/chain/
            cp "$RUNNER_TEMP/keep/fillers.json" data/chain/fillers.json
            mkdir -p data/treasury && cp -n "$RUNNER_TEMP/keep-treasury"/*.jsonl data/treasury/ 2>/dev/null || true
            npm run rebuild && npm run verify
            sleep 10
          done
          exit 1

  # Any job failing means the day was not frozen in this slot.
  tell:
    needs: [start, read, freeze]
    # A job that passes its time limit ends as cancelled, not failed, so failure() alone would miss it.
    if: ${{ always() && inputs.commit && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tell Telegram the day was not frozen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Tideline: the daily chain snapshot failed in this slot. A later slot today (up to 09:17 UTC) tries again; if none freezes it, yesterday stays a gap. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/failed.txt"
          node pipeline/telegram.mjs "$RUNNER_TEMP/failed.txt"

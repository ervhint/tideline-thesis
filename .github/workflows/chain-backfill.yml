name: chain-backfill

# T3 (docs/PLAN.md §6): freezes past UTC days of intents.near swaps into data/chain/<day>.jsonl, the same way chain-day does.
# By hand only. The days are cut into jobs of 3 days (a day takes about 95 min, a job may run 6 hours); at most 6 jobs run at once,
# each on its own runner. Keyless public reads only (FastNEAR, NEAR RPC, DefiLlama).
# Every day uses the filler list committed on the branch as it is. No discovery runs, so the list never changes here and older days
# can miss a solver that has since left (each day file names the list it used).
# A day that cannot be read well stays a gap: its step logs NOT FROZEN, nothing is written, and the run does not go back to fill it.
# chain_day.mjs also writes data/treasury/<day>.jsonl, which this workflow does not keep: run treasury-backfill for those days afterwards.
# One last job copies all frozen days in, recomputes the derived files, runs `npm run verify`, and commits once (only if `commit` is on).
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First UTC day, YYYY-MM-DD'
        type: string
        default: '2026-10-04'
      to:
        description: 'Last UTC day, YYYY-MM-DD'
        type: string
        default: '2026-11-02'
      commit:
        description: 'Commit the frozen days to the branch this run is on'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: chain-backfill

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: echo "matrix=$(node pipeline/backfill_plan.mjs "$FROM" "$TO")" >> "$GITHUB_OUTPUT"

  freeze:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze the days of this job
        env:
          DAYS: ${{ matrix.days }}
        run: |
          for d in $DAYS; do
            echo "::group::$d"
            timeout 115m node pipeline/chain_day.mjs "$d" || echo "::warning::$d is a gap"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: days-${{ matrix.job }}
          path: data/chain/20*.jsonl
          if-no-files-found: ignore

  commit:
    needs: freeze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: days-*
          path: ${{ runner.temp }}/days
          merge-multiple: true
      - name: Add the days, recompute and check
        run: |
          ls "$RUNNER_TEMP/days" 2>/dev/null | wc -l | xargs echo "frozen day files:"
          # Never replace a day already on the branch (a day is written once).
          cp -n "$RUNNER_TEMP/days"/*.jsonl data/chain/ 2>/dev/null || true
          npm run rebuild
          npm run verify
          node -e "const d=JSON.parse(require('fs').readFileSync('data/published/chain_days.json','utf8'));console.log('frozen days',d.days.length,'gap days',JSON.stringify(d.gaps))" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chain
          path: |
            data/chain/
            data/published/chain_days.json
      - name: Commit
        if: inputs.commit
        run: |
          git config user.name "tideline-chain"
          git config user.email "tideline-chain@users.noreply.github.com"
          for i in 1 2 3; do
            git add data
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "data: backfill chain days ${{ inputs.from }} to ${{ inputs.to }}"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            # Another run moved the branch (the daily freeze): start again from it and add the days once more.
            git rebase --abort 2>/dev/null || true
            git reset --hard "origin/$GITHUB_REF_NAME" 2>/dev/null || { git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"; }
            cp -n "$RUNNER_TEMP/days"/*.jsonl data/chain/ 2>/dev/null || true
            npm run rebuild && npm run verify
            sleep 10
          done
          exit 1

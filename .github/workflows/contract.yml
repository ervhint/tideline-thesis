name: contract

on:
  push:
    paths:
      - 'contract/**'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NEAR_VERSION: 0.22.0

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      # Toolchain and wasm target come from contract/rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      # The wasm comes first: tests/sandbox.rs runs the compiled contract.
      - run: cargo near build non-reproducible-wasm
      - run: cargo test
      - run: sha256sum target/near/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tideline-attest-wasm
          path: |
            contract/target/near/*.wasm
            contract/target/near/*.json
            contract/Cargo.lock
